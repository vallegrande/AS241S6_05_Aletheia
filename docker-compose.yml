services:
  db:
    image: postgres:16-alpine
    container_name: aletheia-db
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    ports:
      - "5432:5432"
    volumes:
      - aletheia-pgdata:/var/lib/postgresql/data
      - ./server/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    container_name: aletheia-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://aletheia:aletheia@db:5432/aletheia
      FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aletheia-pgdata:
